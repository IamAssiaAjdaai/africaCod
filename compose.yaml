services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: africacod
      POSTGRES_PASSWORD: africacod_local
      POSTGRES_DB: africacod
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/db/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U africacod -d africacod"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
