name: Checkpoint quality gate
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: africacod
          POSTGRES_PASSWORD: local_ci_password
          POSTGRES_DB: africacod
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U africacod -d africacod"
          --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://africacod:local_ci_password@localhost:5432/africacod
      TEST_DATABASE_URL: postgresql://africacod:local_ci_password@localhost:5432/africacod_test
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-disposable-secret-never-for-production-2026
      PGPASSWORD: local_ci_password
      TURBO_TELEMETRY_DISABLED: 1
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: createdb -h localhost -U africacod africacod_test
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm typecheck && pnpm lint && pnpm format:check && pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
